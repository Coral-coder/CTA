name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub release (tag v<version>) from this commit"
        type: boolean
        default: false
      windows_only:
        description: "Skip macOS (e.g. when macOS runners are unavailable)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # releases (manual runs) never get cancelled by a push to the same branch
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  PYTHON_VERSION: "3.12"
  MODEL_KEY: model-discogs-effnet-bsdynamic-1-a280825b

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.windows_only && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest","windows-latest","macos-latest"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Cache AI model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: build_models
          key: ${{ env.MODEL_KEY }}

      - name: Fetch AI model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: python packaging/fetch_model.py build_models

      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests packaging/fetch_model.py

      - name: Unit + integration tests
        env:
          CTA_MODEL_PATH: ${{ github.workspace }}/build_models/discogs-effnet-bsdynamic-1.onnx
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          set +e
          pytest -v --durations=15
          code=$?
          echo "pytest process exit code: $code"
          exit $code

  build:
    name: Build (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.windows_only && '[{"os":"windows-latest","target":"windows-x64"}]' || '[{"os":"windows-latest","target":"windows-x64"},{"os":"macos-latest","target":"macos-arm64"}]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Cache AI model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: build_models
          key: ${{ env.MODEL_KEY }}

      - name: Fetch AI model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: python packaging/fetch_model.py build_models

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install . "pyinstaller>=6.10"

      - name: Version
        id: ver
        shell: bash
        run: echo "version=$(python -c 'import cta; print(cta.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Build executable
        run: pyinstaller --noconfirm --clean packaging/cta.spec

      # ---- verify the frozen build actually works before shipping it ----
      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CTA_DATA_DIR: ${{ runner.temp }}\cta-data
        run: |
          & dist\CTA\cta-cli.exe selftest
          if ($LASTEXITCODE -ne 0) { throw "selftest failed" }
          $env:CTA_SMOKE_EXIT_MS = "4000"
          $p = Start-Process -FilePath dist\CTA\CTA.exe -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "GUI did not exit" }
          if ($p.ExitCode -ne 0) { throw "GUI smoke test failed: $($p.ExitCode)" }
          Write-Host "GUI smoke test passed"
          # background mix server: tray, phone page and home-screen icon over HTTP
          $env:CTA_SMOKE_EXIT_MS = "20000"
          $p = Start-Process -FilePath dist\CTA\CTA.exe -ArgumentList "--background" -PassThru
          $served = $false
          for ($i = 0; $i -lt 18 -and -not $served; $i++) {
            Start-Sleep -Seconds 1
            try {
              $r = Invoke-WebRequest -UseBasicParsing -TimeoutSec 3 http://127.0.0.1:8000/apple-touch-icon.png
              $page = Invoke-WebRequest -UseBasicParsing -TimeoutSec 3 http://127.0.0.1:8000/
              $served = ($r.StatusCode -eq 200) -and ($page.Content -match "CTA live remote")
            } catch { }
          }
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "background mode did not exit" }
          if (-not $served) { throw "mix server did not serve the phone remote" }
          if ($p.ExitCode -ne 0) { throw "background smoke test failed: $($p.ExitCode)" }
          Write-Host "Background mix server smoke test passed"

      - name: Self-test (macOS)
        if: runner.os == 'macOS'
        env:
          CTA_DATA_DIR: ${{ runner.temp }}/cta-data
        run: |
          dist/CTA.app/Contents/MacOS/CTA selftest
          CTA_SMOKE_EXIT_MS=4000 perl -e 'alarm 180; exec @ARGV' dist/CTA.app/Contents/MacOS/CTA

      # ---- prove the self-updater can replace an installed copy ----
      - name: Update swap test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CTA_DATA_DIR: ${{ runner.temp }}\upd-data
        run: |
          $t = Join-Path $env:RUNNER_TEMP 'updtest'
          New-Item -ItemType Directory -Force "$t\install", "$t\new" | Out-Null
          Copy-Item -Recurse dist\CTA "$t\install\CTA"
          Copy-Item -Recurse dist\CTA "$t\new\CTA"
          Set-Content "$t\new\CTA\marker.txt" 'NEWBUILD'
          Compress-Archive -Path "$t\new\CTA" -DestinationPath "$t\update.zip"
          & "$t\install\CTA\cta-cli.exe" update --from-zip "$t\update.zip" --no-relaunch
          if ($LASTEXITCODE -ne 0) { throw "staging failed" }
          $log = Join-Path $env:CTA_DATA_DIR 'update.log'
          for ($i = 0; $i -lt 120; $i++) {
            if ((Test-Path $log) -and (Select-String -Path $log -Pattern 'UPDATE (OK|FAILED)' -Quiet)) { break }
            Start-Sleep -Milliseconds 500
          }
          Get-Content $log
          if (Test-Path "$log.transcript") { Get-Content "$log.transcript" }
          if (-not (Select-String -Path $log -Pattern 'UPDATE OK' -Quiet)) { throw "swap failed" }
          if ((Get-Content "$t\install\CTA\marker.txt") -ne 'NEWBUILD') { throw "install not replaced" }
          & "$t\install\CTA\cta-cli.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "updated build does not start" }

      - name: Update swap test (macOS)
        if: runner.os == 'macOS'
        env:
          CTA_DATA_DIR: ${{ runner.temp }}/upd-data
        run: |
          set -e
          t="$RUNNER_TEMP/updtest"; mkdir -p "$t/install" "$t/new"
          ditto dist/CTA.app "$t/install/CTA.app"
          ditto dist/CTA.app "$t/new/CTA.app"
          echo NEWBUILD > "$t/new/CTA.app/Contents/Resources/marker.txt"
          codesign --force --deep --sign - "$t/new/CTA.app"
          ditto -c -k --keepParent "$t/new/CTA.app" "$t/update.zip"
          "$t/install/CTA.app/Contents/MacOS/CTA" update --from-zip "$t/update.zip" --no-relaunch
          log="$CTA_DATA_DIR/update.log"
          for i in $(seq 1 120); do grep -qE 'UPDATE (OK|FAILED)' "$log" 2>/dev/null && break; sleep 0.5; done
          cat "$log"
          grep -q 'UPDATE OK' "$log"
          grep -q NEWBUILD "$t/install/CTA.app/Contents/Resources/marker.txt"
          "$t/install/CTA.app/Contents/MacOS/CTA" --version

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item README.md, THIRD_PARTY_NOTICES.md dist\CTA\
          Compress-Archive -Path dist\CTA -DestinationPath "CTA-${{ steps.ver.outputs.version }}-${{ matrix.target }}.zip"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - dist/CTA.app
          ditto -c -k --sequesterRsrc --keepParent dist/CTA.app "CTA-${{ steps.ver.outputs.version }}-${{ matrix.target }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: CTA-${{ matrix.target }}
          path: CTA-*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Version
        id: ver
        run: echo "version=$(grep -oP '__version__ = "\K[^"]+' src/cta/__init__.py)" >> "$GITHUB_OUTPUT"
      - name: Checksums
        run: cd artifacts && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: CTA ${{ steps.ver.outputs.version }}
          files: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## Download
            - **Windows 10/11 (x64)**: `CTA-*-windows-x64.zip` → unzip anywhere → run `CTA.exe`
            - **macOS (Apple Silicon)**: `CTA-*-macos-arm64.zip` → unzip → right-click `CTA.app` → Open (first launch only; the app is not notarised)

            The AI model is bundled; AI inference uses the GPU through DirectML (Windows) or CoreML (macOS) and falls back to the CPU automatically.
