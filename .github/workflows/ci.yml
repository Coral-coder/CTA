name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub release (tag v<version>) from this commit"
        type: boolean
        default: false
      windows_only:
        description: "Skip macOS (e.g. when macOS runners are unavailable)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # releases (manual runs) never get cancelled by a push to the same branch
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  PYTHON_VERSION: "3.12"
  MODEL_KEY: model-discogs-effnet-bsdynamic-1-a280825b

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.windows_only && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest","windows-latest","macos-latest"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Cache AI model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: build_models
          key: ${{ env.MODEL_KEY }}

      - name: Fetch AI model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: python packaging/fetch_model.py build_models

      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests packaging/fetch_model.py

      - name: Unit + integration tests
        env:
          CTA_MODEL_PATH: ${{ github.workspace }}/build_models/discogs-effnet-bsdynamic-1.onnx
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          set +e
          pytest -v --durations=15 2>&1 | tee pytest.log
          code=${PIPESTATUS[0]}
          echo "pytest process exit code: $code"
          # tests/conftest.py prints pytest's own result before the process ends; a
          # native library crashing while the process is torn down afterwards
          # (seen on Windows runners) is not a test failure
          if [ "$code" -ne 0 ] && grep -q "^\[cta\] pytest exit status 0;" pytest.log; then
            echo "::warning::all tests passed; the process crashed during teardown (exit $code)"
            code=0
          fi
          exit $code

  build:
    name: Build (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.windows_only && '[{"os":"windows-latest","target":"windows-x64"}]' || '[{"os":"windows-latest","target":"windows-x64"},{"os":"macos-latest","target":"macos-arm64"}]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Cache AI model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: build_models
          key: ${{ env.MODEL_KEY }}

      - name: Fetch AI model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: python packaging/fetch_model.py build_models

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install . "pyinstaller>=6.10"

      - name: Version
        id: ver
        shell: bash
        run: echo "version=$(python -c 'import cta; print(cta.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Build executable
        run: pyinstaller --noconfirm --clean packaging/cta.spec

      # ---- macOS: Developer ID signature (hardened runtime) when the secrets are there ----
      # DEVELOPER_ID_P12 / DEVELOPER_ID_P12_PASSWORD come from Dev_deploy_setup
      # (Actions -> Create Developer ID certificate, or Set up app repo). Without them the
      # app is built ad-hoc signed, as before (right-click -> Open on first launch).
      - name: Sign (macOS)
        if: runner.os == 'macOS'
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -e
          if [ -z "$DEVELOPER_ID_P12" ]; then
            echo "::warning::No DEVELOPER_ID_P12 secret: building an unsigned (ad-hoc) app. Run 'Create Developer ID certificate' in Dev_deploy_setup for this repo."
            codesign --force --deep --sign - dist/Tempest.app
            exit 0
          fi
          keychain="$RUNNER_TEMP/sign.keychain-db"
          kpass=$(openssl rand -hex 16)
          printf '%s' "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          security create-keychain -p "$kpass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$kpass" "$keychain"
          security import "$RUNNER_TEMP/devid.p12" -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kpass" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/devid.p12"
          id=$(security find-identity -v -p codesigning "$keychain" | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.+)"/\1/')
          if [ -z "$id" ]; then echo "::error::The .p12 holds no 'Developer ID Application' identity"; exit 1; fi
          echo "Signing as: $id"
          bash packaging/sign_mac.sh dist/Tempest.app "$id" packaging/entitlements.plist
          echo "SIGN_ID=$id" >> "$GITHUB_ENV"
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      # ---- verify the frozen build actually works before shipping it ----
      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CTA_DATA_DIR: ${{ runner.temp }}\cta-data
        run: |
          & dist\Tempest\tempest-cli.exe selftest
          if ($LASTEXITCODE -ne 0) { throw "selftest failed" }
          $env:CTA_SMOKE_EXIT_MS = "4000"
          $p = Start-Process -FilePath dist\Tempest\Tempest.exe -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "GUI did not exit" }
          if ($p.ExitCode -ne 0) { throw "GUI smoke test failed: $($p.ExitCode)" }
          Write-Host "GUI smoke test passed"
          # background mix server: tray, phone page and home-screen icon over HTTP
          $env:CTA_SMOKE_EXIT_MS = "20000"
          $p = Start-Process -FilePath dist\Tempest\Tempest.exe -ArgumentList "--background" -PassThru
          $served = $false
          for ($i = 0; $i -lt 18 -and -not $served; $i++) {
            Start-Sleep -Seconds 1
            try {
              $r = Invoke-WebRequest -UseBasicParsing -TimeoutSec 3 http://127.0.0.1:8000/apple-touch-icon.png
              $page = Invoke-WebRequest -UseBasicParsing -TimeoutSec 3 http://127.0.0.1:8000/
              $served = ($r.StatusCode -eq 200) -and ($page.Content -match "Tempest live remote")
            } catch { }
          }
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "background mode did not exit" }
          if (-not $served) { throw "mix server did not serve the phone remote" }
          if ($p.ExitCode -ne 0) { throw "background smoke test failed: $($p.ExitCode)" }
          Write-Host "Background mix server smoke test passed"

      - name: Self-test (macOS)
        if: runner.os == 'macOS'
        env:
          CTA_DATA_DIR: ${{ runner.temp }}/cta-data
        run: |
          dist/Tempest.app/Contents/MacOS/Tempest selftest
          CTA_SMOKE_EXIT_MS=4000 perl -e 'alarm 180; exec @ARGV' dist/Tempest.app/Contents/MacOS/Tempest

      # ---- prove the self-updater can replace an installed copy ----
      - name: Update swap test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CTA_DATA_DIR: ${{ runner.temp }}\upd-data
        run: |
          $t = Join-Path $env:RUNNER_TEMP 'updtest'
          New-Item -ItemType Directory -Force "$t\install", "$t\new" | Out-Null
          Copy-Item -Recurse dist\Tempest "$t\install\Tempest"
          Copy-Item -Recurse dist\Tempest "$t\new\Tempest"
          Set-Content "$t\new\Tempest\marker.txt" 'NEWBUILD'
          Compress-Archive -Path "$t\new\Tempest" -DestinationPath "$t\update.zip"
          & "$t\install\Tempest\tempest-cli.exe" update --from-zip "$t\update.zip" --no-relaunch
          if ($LASTEXITCODE -ne 0) { throw "staging failed" }
          $log = Join-Path $env:CTA_DATA_DIR 'update.log'
          for ($i = 0; $i -lt 120; $i++) {
            if ((Test-Path $log) -and (Select-String -Path $log -Pattern 'UPDATE (OK|FAILED)' -Quiet)) { break }
            Start-Sleep -Milliseconds 500
          }
          Get-Content $log
          if (Test-Path "$log.transcript") { Get-Content "$log.transcript" }
          if (-not (Select-String -Path $log -Pattern 'UPDATE OK' -Quiet)) { throw "swap failed" }
          if ((Get-Content "$t\install\Tempest\marker.txt") -ne 'NEWBUILD') { throw "install not replaced" }
          & "$t\install\Tempest\tempest-cli.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "updated build does not start" }

      - name: Update swap test (macOS)
        if: runner.os == 'macOS'
        env:
          CTA_DATA_DIR: ${{ runner.temp }}/upd-data
        run: |
          set -e
          t="$RUNNER_TEMP/updtest"; mkdir -p "$t/install" "$t/new"
          ditto dist/Tempest.app "$t/install/Tempest.app"
          ditto dist/Tempest.app "$t/new/Tempest.app"
          echo NEWBUILD > "$t/new/Tempest.app/Contents/Resources/marker.txt"
          if [ -n "${SIGN_ID:-}" ]; then
            bash packaging/sign_mac.sh "$t/new/Tempest.app" "$SIGN_ID" packaging/entitlements.plist
          else
            codesign --force --deep --sign - "$t/new/Tempest.app"
          fi
          ditto -c -k --keepParent "$t/new/Tempest.app" "$t/update.zip"
          "$t/install/Tempest.app/Contents/MacOS/Tempest" update --from-zip "$t/update.zip" --no-relaunch
          log="$CTA_DATA_DIR/update.log"
          for i in $(seq 1 120); do grep -qE 'UPDATE (OK|FAILED)' "$log" 2>/dev/null && break; sleep 0.5; done
          cat "$log"
          grep -q 'UPDATE OK' "$log"
          grep -q NEWBUILD "$t/install/Tempest.app/Contents/Resources/marker.txt"
          "$t/install/Tempest.app/Contents/MacOS/Tempest" --version

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item README.md, THIRD_PARTY_NOTICES.md dist\Tempest\
          Compress-Archive -Path dist\Tempest -DestinationPath "Tempest-${{ steps.ver.outputs.version }}-${{ matrix.target }}.zip"
          # a legacy-named copy: installs still called CTA (2.2.x) look for CTA\CTA.exe and cta-cli.exe
          New-Item -ItemType Directory legacy | Out-Null
          Copy-Item -Recurse dist\Tempest legacy\CTA
          Copy-Item legacy\CTA\Tempest.exe legacy\CTA\CTA.exe
          Copy-Item legacy\CTA\tempest-cli.exe legacy\CTA\cta-cli.exe
          Compress-Archive -Path legacy\CTA -DestinationPath "legacy-CTA-${{ steps.ver.outputs.version }}-${{ matrix.target }}.zip"

      # ---- macOS: notarize with the App Store Connect key, staple, then zip ----
      - name: Notarize (macOS)
        if: runner.os == 'macOS' && env.SIGN_ID != ''
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -e
          if [ -z "$ASC_KEY_P8" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ]; then
            echo "::warning::Signed but not notarized: ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8 missing (run Set up app repo in Dev_deploy_setup)"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/asc"
          if printf '%s' "$ASC_KEY_P8" | grep -q BEGIN; then printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/key.p8"
          else printf '%s' "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/asc/key.p8"; fi
          ditto -c -k --sequesterRsrc --keepParent dist/Tempest.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --key "$RUNNER_TEMP/asc/key.p8" \
            --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait --timeout 40m | tee "$RUNNER_TEMP/notary.log"
          if ! grep -q 'status: Accepted' "$RUNNER_TEMP/notary.log"; then
            sub=$(grep -m1 -oE 'id: [0-9a-f-]+' "$RUNNER_TEMP/notary.log" | head -1 | cut -d' ' -f2)
            [ -n "$sub" ] && xcrun notarytool log "$sub" --key "$RUNNER_TEMP/asc/key.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" || true
            echo "::error::Notarization was not accepted"; exit 1
          fi
          xcrun stapler staple dist/Tempest.app
          spctl --assess --type execute --verbose=2 dist/Tempest.app
          rm -rf "$RUNNER_TEMP/asc" "$RUNNER_TEMP/notarize.zip"
          echo "### macOS: signed as $SIGN_ID and notarized" >> "$GITHUB_STEP_SUMMARY"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          if [ -z "${SIGN_ID:-}" ]; then codesign --force --deep --sign - dist/Tempest.app; fi
          ditto -c -k --sequesterRsrc --keepParent dist/Tempest.app "Tempest-${{ steps.ver.outputs.version }}-${{ matrix.target }}.zip"
          # a legacy-named copy: installs still called CTA (2.2.x) look for CTA.app/Contents/MacOS/CTA
          mkdir -p legacy
          ditto dist/Tempest.app legacy/CTA.app
          cp legacy/CTA.app/Contents/MacOS/Tempest legacy/CTA.app/Contents/MacOS/CTA
          if [ -n "${SIGN_ID:-}" ]; then bash packaging/sign_mac.sh legacy/CTA.app "$SIGN_ID" packaging/entitlements.plist
          else codesign --force --deep --sign - legacy/CTA.app; fi
          ditto -c -k --sequesterRsrc --keepParent legacy/CTA.app "legacy-CTA-${{ steps.ver.outputs.version }}-${{ matrix.target }}.zip"

      - name: Remove the signing keychain (macOS)
        if: always() && runner.os == 'macOS'
        run: |
          if [ -n "${KEYCHAIN:-}" ] && [ -f "$KEYCHAIN" ]; then security delete-keychain "$KEYCHAIN" || true; fi

      - uses: actions/upload-artifact@v4
        with:
          name: Tempest-${{ matrix.target }}
          path: |
            Tempest-*.zip
            legacy-CTA-*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write          # create the GitHub release and upload the zips
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Version
        id: ver
        run: echo "version=$(grep -oP '__version__ = "\K[^"]+' src/cta/__init__.py)" >> "$GITHUB_OUTPUT"
      - name: Checksums
        run: cd artifacts && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: Tempest ${{ steps.ver.outputs.version }}
          files: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## Download
            - **Windows 10/11 (x64)**: `Tempest-*-windows-x64.zip` → unzip anywhere → run `Tempest.exe`
            - **macOS (Apple Silicon)**: `Tempest-*-macos-arm64.zip` → unzip → drag `Tempest.app` to Applications → open. (If this build is unsigned, right-click → Open the first time.)
            - The `legacy-CTA-*` zips exist only so installs still named CTA (2.2.x) can update themselves; new users ignore them.

            The AI model is bundled; AI inference uses the GPU through DirectML (Windows) or CoreML (macOS) and falls back to the CPU automatically.
