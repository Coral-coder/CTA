<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Tempest: a record seen from above that is also the eye of a storm, a lightning bolt across it.
       Plain gradients, strokes and opacity only (rendered by QtSvg: no filters). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16204f"/>
      <stop offset="0.55" stop-color="#0b1030"/>
      <stop offset="1" stop-color="#04050d"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5b6cff" stop-opacity="0.45"/>
      <stop offset="0.7" stop-color="#5b6cff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#5b6cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="disc" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#151a36"/>
      <stop offset="1" stop-color="#070914"/>
    </radialGradient>
    <linearGradient id="swirl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#29e7ff"/>
      <stop offset="0.5" stop-color="#6d7dff"/>
      <stop offset="1" stop-color="#b14dff"/>
    </linearGradient>
    <radialGradient id="label" cx="0.42" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#ff7ae0"/>
      <stop offset="0.6" stop-color="#a43cff"/>
      <stop offset="1" stop-color="#4b2bd6"/>
    </radialGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#fff59a"/>
      <stop offset="1" stop-color="#ffb21f"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect x="32" y="32" width="960" height="960" rx="210" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="210" fill="none" stroke="#2c3a86" stroke-width="6"/>

  <!-- glow behind the record -->
  <circle cx="512" cy="512" r="420" fill="url(#halo)"/>

  <!-- the record -->
  <circle cx="512" cy="512" r="345" fill="url(#disc)"/>
  <circle cx="512" cy="512" r="345" fill="none" stroke="#2a3370" stroke-width="5"/>
  <g fill="none" stroke="#1f2758" stroke-width="3">
    <circle cx="512" cy="512" r="310"/>
    <circle cx="512" cy="512" r="282"/>
    <circle cx="512" cy="512" r="254"/>
    <circle cx="512" cy="512" r="226"/>
    <circle cx="512" cy="512" r="198"/>
    <circle cx="512" cy="512" r="170"/>
  </g>

  <!-- the storm: three arms spinning round the eye -->
  <g fill="none" stroke="url(#swirl)" stroke-linecap="round">
    <g>
      <path d="M 512 190 A 322 322 0 0 1 834 512" stroke-width="30" stroke-opacity="0.95"/>
      <path d="M 512 250 A 262 262 0 0 1 755 412" stroke-width="20" stroke-opacity="0.75"/>
      <path d="M 512 310 A 202 202 0 0 1 680 400" stroke-width="12" stroke-opacity="0.55"/>
    </g>
    <g transform="rotate(120 512 512)">
      <path d="M 512 190 A 322 322 0 0 1 834 512" stroke-width="30" stroke-opacity="0.95"/>
      <path d="M 512 250 A 262 262 0 0 1 755 412" stroke-width="20" stroke-opacity="0.75"/>
      <path d="M 512 310 A 202 202 0 0 1 680 400" stroke-width="12" stroke-opacity="0.55"/>
    </g>
    <g transform="rotate(240 512 512)">
      <path d="M 512 190 A 322 322 0 0 1 834 512" stroke-width="30" stroke-opacity="0.95"/>
      <path d="M 512 250 A 262 262 0 0 1 755 412" stroke-width="20" stroke-opacity="0.75"/>
      <path d="M 512 310 A 202 202 0 0 1 680 400" stroke-width="12" stroke-opacity="0.55"/>
    </g>
  </g>

  <!-- the eye / label -->
  <circle cx="512" cy="512" r="118" fill="url(#label)"/>
  <circle cx="512" cy="512" r="118" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="4"/>
  <circle cx="512" cy="512" r="16" fill="#070914"/>

  <!-- lightning: soft glow layers, then the bolt -->
  <g stroke-linejoin="round">
    <path d="M 600 120 L 392 540 L 512 540 L 420 900 L 700 448 L 572 448 L 664 120 Z"
          fill="#ffd23f" fill-opacity="0.10" stroke="#ffd23f" stroke-opacity="0.10" stroke-width="64"/>
    <path d="M 600 120 L 392 540 L 512 540 L 420 900 L 700 448 L 572 448 L 664 120 Z"
          fill="#ffd23f" fill-opacity="0.18" stroke="#ffd23f" stroke-opacity="0.22" stroke-width="30"/>
    <path d="M 600 120 L 392 540 L 512 540 L 420 900 L 700 448 L 572 448 L 664 120 Z"
          fill="url(#bolt)" stroke="#fff7c2" stroke-width="8"/>
  </g>
</svg>
