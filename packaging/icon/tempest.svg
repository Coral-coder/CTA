<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Tempest: a black record with a paper label, a red lightning bolt through it.
       Three flat colours - cream, black, red. No gradients, no glow. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ebe4d6"/>
      <stop offset="1" stop-color="#ebe4d6"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect x="32" y="32" width="960" height="960" rx="210" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="210" fill="none" stroke="#d3c9b6" stroke-width="6"/>

  <!-- the record -->
  <circle cx="512" cy="512" r="352" fill="#121212"/>
  <g fill="none" stroke="#2b2b2b" stroke-width="4">
    <circle cx="512" cy="512" r="318"/>
    <circle cx="512" cy="512" r="290"/>
    <circle cx="512" cy="512" r="262"/>
    <circle cx="512" cy="512" r="234"/>
    <circle cx="512" cy="512" r="206"/>
    <circle cx="512" cy="512" r="178"/>
  </g>
  <!-- label -->
  <circle cx="512" cy="512" r="124" fill="#ebe4d6"/>
  <circle cx="512" cy="512" r="14" fill="#121212"/>

  <!-- the bolt, with a dark keyline so it stands off the record -->
  <path d="M 604 118 L 396 540 L 514 540 L 424 906 L 704 446 L 578 446 L 668 118 Z"
        fill="#121212" stroke="#121212" stroke-width="24" stroke-linejoin="round"/>
  <path d="M 604 118 L 396 540 L 514 540 L 424 906 L 704 446 L 578 446 L 668 118 Z" fill="#d4432f"/>
</svg>
