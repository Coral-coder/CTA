<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2140"/>
      <stop offset="1" stop-color="#070a16"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.52" r="0.5">
      <stop offset="0" stop-color="#7b5cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7b5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5fd2"/>
      <stop offset="0.55" stop-color="#b44dff"/>
      <stop offset="1" stop-color="#5a3dff"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4160"/>
      <stop offset="1" stop-color="#121628"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#20e3ff"/>
      <stop offset="0.5" stop-color="#6c8cff"/>
      <stop offset="1" stop-color="#20e3ff"/>
    </linearGradient>
    <filter id="neon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="brainclip">
      <path d="M512 300 C440 250 330 262 300 340 C238 352 214 430 246 486 C206 540 232 622 300 640
               C318 708 404 742 468 712 C488 738 536 738 556 712 C620 742 706 708 724 640
               C792 622 818 540 778 486 C810 430 786 352 724 340 C694 262 584 250 512 300 Z"/>
    </clipPath>
  </defs>

  <!-- tile -->
  <rect x="32" y="32" width="960" height="960" rx="210" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="210" fill="none" stroke="#2f3a6e" stroke-width="6"/>
  <circle cx="512" cy="540" r="420" fill="url(#glow)"/>

  <!-- brain -->
  <g filter="url(#soft)">
    <path d="M512 300 C440 250 330 262 300 340 C238 352 214 430 246 486 C206 540 232 622 300 640
             C318 708 404 742 468 712 C488 738 536 738 556 712 C620 742 706 708 724 640
             C792 622 818 540 778 486 C810 430 786 352 724 340 C694 262 584 250 512 300 Z"
          fill="url(#brain)"/>
  </g>
  <g clip-path="url(#brainclip)" fill="none" stroke="#2a0f5a" stroke-opacity="0.55" stroke-width="16" stroke-linecap="round">
    <!-- hemisphere split and folds (gyri) -->
    <path d="M512 300 C500 380 528 440 508 520 C492 590 520 650 512 730"/>
    <path d="M300 345 C350 370 380 350 420 380 C450 400 440 440 470 455"/>
    <path d="M250 485 C300 470 330 500 370 490 C410 480 420 520 460 520"/>
    <path d="M300 640 C340 600 380 620 410 590 C440 560 470 590 480 560"/>
    <path d="M724 345 C674 370 644 350 604 380 C574 400 584 440 554 455"/>
    <path d="M774 485 C724 470 694 500 654 490 C614 480 604 520 564 520"/>
    <path d="M724 640 C684 600 644 620 614 590 C584 560 554 590 544 560"/>
  </g>

  <!-- circuit traces (the cybernetic half) -->
  <g clip-path="url(#brainclip)" filter="url(#neon)" stroke="#29f3ff" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M540 330 L600 330 L640 370 L720 370"/>
    <path d="M548 410 L620 410 L660 450 L790 450"/>
    <path d="M540 500 L600 500 L640 540 L700 540 L740 580"/>
    <path d="M552 590 L610 590 L650 630 L690 630"/>
    <path d="M546 680 L600 680 L630 650"/>
  </g>
  <g fill="#e9fdff" filter="url(#neon)">
    <circle cx="720" cy="370" r="15"/><circle cx="660" cy="450" r="12"/>
    <circle cx="740" cy="580" r="15"/><circle cx="690" cy="630" r="13"/>
    <circle cx="630" cy="650" r="12"/><circle cx="600" cy="330" r="10"/>
    <circle cx="600" cy="500" r="10"/>
  </g>

  <!-- headphones: band -->
  <path d="M232 560 C232 300 360 180 512 180 C664 180 792 300 792 560"
        fill="none" stroke="#0c1022" stroke-width="64" stroke-linecap="round"/>
  <path d="M232 560 C232 300 360 180 512 180 C664 180 792 300 792 560"
        fill="none" stroke="url(#metal)" stroke-width="50" stroke-linecap="round"/>
  <path d="M262 520 C270 320 380 214 512 214 C644 214 754 320 762 520"
        fill="none" stroke="url(#band)" stroke-width="10" stroke-linecap="round" filter="url(#neon)"/>

  <!-- ear cups -->
  <g>
    <rect x="150" y="480" width="150" height="250" rx="62" fill="#0c1022"/>
    <rect x="160" y="490" width="130" height="230" rx="56" fill="url(#metal)"/>
    <rect x="186" y="520" width="78" height="170" rx="38" fill="none" stroke="#ff4fd8" stroke-width="12" filter="url(#neon)"/>
    <rect x="724" y="480" width="150" height="250" rx="62" fill="#0c1022"/>
    <rect x="734" y="490" width="130" height="230" rx="56" fill="url(#metal)"/>
    <rect x="760" y="520" width="78" height="170" rx="38" fill="none" stroke="#29f3ff" stroke-width="12" filter="url(#neon)"/>
  </g>

  <!-- equaliser bars under the brain -->
  <g fill="#29f3ff" filter="url(#neon)">
    <rect x="404" y="800" width="26" height="60" rx="8"/>
    <rect x="446" y="770" width="26" height="90" rx="8"/>
    <rect x="488" y="790" width="26" height="70" rx="8" fill="#ff4fd8"/>
    <rect x="530" y="760" width="26" height="100" rx="8"/>
    <rect x="572" y="785" width="26" height="75" rx="8" fill="#ff4fd8"/>
    <rect x="614" y="805" width="26" height="55" rx="8"/>
  </g>
</svg>
