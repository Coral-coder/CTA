[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cta"
dynamic = ["version"]
description = "DJ library analyser: BPM, key, AI genre/style and instant setlist building"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "av>=12.0",
    "mutagen>=1.47",
    "platformdirs>=4.0",
    "PySide6-Essentials>=6.6",
    "scipy>=1.11",
    "pylibrb>=0.1.2",
    "sounddevice>=0.4.6",
    "python-rtmidi>=1.5",
    "qrcode>=7.4",
    "certifi>=2024.2",
    "onnxruntime>=1.17; sys_platform != 'win32'",
    "onnxruntime-directml>=1.17; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.3", "ruff>=0.5", "pyinstaller>=6.6"]

[project.scripts]
cta = "cta.cli:main"

[tool.setuptools.dynamic]
version = { attr = "cta.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cta = ["discogs400_labels.txt", "icon.png", "app-icon-180.png", "app-icon-512.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E731", "B008", "B905", "E741"]

[tool.ruff.lint.per-file-ignores]
"src/cta/dj/remote_page.py" = ["E501"]   # embedded HTML/JS page
